<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <meta name="keywords" content="" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta http-equiv="X-UA-Compatible" content="IE=7" />
    <title>Login Page</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required 
                    title="Username must be 3-20 characters and can contain letters, numbers, dots, underscores or hyphens">
                <div class="input-hint">3-20 characters (letters, numbers, ., _, -)</div>
                <span class="valid-icon" id="usernameValid">✓</span>
            </div>
            
            <div class="input-group" id="passwordGroup" style="display: none;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                    title="Password must be at least 8 characters including 1 uppercase, 1 lowercase, 1 number and 1 special character">
                <div class="input-hint">At least 8 chars: 1 uppercase, 1 lowercase, 1 number, 1 special char</div>
                <span class="valid-icon" id="passwordValid">✓</span>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            
            <button type="submit" id="loginButton">Login</button>
        </form>
    </div>

    <script src="./main.js"></script>
</body>
</html>
