<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-4">
    <div class="row">
      <div class="col-md-4 bg-primary text-white p-3">Section 1</div>
      <div class="col-md-4 bg-success text-white p-3">Section 2</div>
      <div class="col-md-4 bg-danger text-white p-3">Section 3</div>
    </div>
    <div class="row mt-3">
      <div class="col-md-6 bg-warning p-3">Section 4</div>
      <div class="col-md-6 bg-info p-3">Section 5</div>
    </div>
  </div>
</body>
</html>
