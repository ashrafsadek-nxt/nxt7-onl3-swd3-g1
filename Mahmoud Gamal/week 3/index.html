<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Jumia</title>
    <style>
      :root {
        --main: #e07e1b;
        --bgColor: #f1f1f2;
      }
      :root {
        font-family: Roboto, -apple-system, BlinkMacSystemFont, Segoe UI,
          Helvetica Neue, Arial, sans-serif;
        font-weight: 500;
        color: #313133;
      }
    </style>
  </head>
  <body dir="rtl">
    <div class="bg-[var(--bgColor)] h-screen">
      <div class="topBar flex justify-between items-center px-20">
        <div class="flex justify-center items-center text-[var(--main)]">
          <img src="assets/star.png" class="w-5 h-4.5" alt="" srcset="" /><span
            class="text-[0.90rem] mr-1"
            >بيع على جوميا</span
          >
        </div>

        <div class="flex justify-center items-center">
          <div class="flex p-2 justify-center items-center gap-1">
            <div class="image-container w-5 h-5 rounded-full overflow-hidden">
              <img
                src="assets/enFlag.png"
                class="rounded-full"
                class="h-full"
                width="32"
                height="32"
                srcset=""
              />
            </div>
            <span class="text-xs">English</span>
          </div>
          <div class="h-5 w-[1px] bg-gray-400"></div>
          <div class="flex p-2 justify-center items-center gap-1">
            <div class="image-container w-5 h-5 rounded-full overflow-hidden">
              <img
                src="assets/egypt-flag.png"
                class="h-full"
                width="32"
                height="32"
                alt=""
                srcset=""
              />
            </div>
            <span class="text-xs">عربى</span>
          </div>
        </div>
      </div>
      <!-- NavBAr -->
      <nav
        class="flex items-center justify-between bg-white py-4 lg:px-20 shadow border-solid"
      >
        <div
          class="flex justify-between lg:w-auto lg:border-b-0 border-solid border-b-2 border-gray-300 lg:pb-0"
        >
          <div class="flex items-center flex-shrink-0 text-gray-800">
            <img src="assets/logo.png" alt="Jumia" />
          </div>
          <div class="block lg:hidden">
            <button
              id="nav"
              class="flex items-center px-3 py-2 border-2 rounded text-blue-700 border-blue-700 hover:text-blue-700 hover:border-blue-700"
            >
              <svg
                class="fill-current h-3 w-3"
                viewBox="0 0 20 20"
                xmlns="http://www.w3.org/2000/svg"
              >
                <title>Menu</title>
                <path d="M0 3h20v2H0V3zm0 6h20v2H0V9zm0 6h20v2H0v-2z" />
              </svg>
            </button>
          </div>
        </div>

        <div
          class="menu w-full lg:block lg:flex lg:items-center lg:w-auto justify-between"
        >
          <div
            class="relative flex flex-row flex-nowrap justify-between items-center text-gray-600 lg:flex hidden"
          >
            <div
              class="flex items-center flex-row border border-gray-400 bg-white py-2 rounded-sm"
            >
              <svg
                class="text-gray-500 absolute my-auto h-full right-2 w-4 fill-current"
                viewBox="0 0 56.966 56.966"
              >
                <path
                  d="M55.146,51.887L41.588,37.786c3.486-4.144,5.396-9.358,5.396-14.786c0-12.682-10.318-23-23-23s-23,10.318-23,23  s10.318,23,23,23c4.761,0,9.298-1.436,13.177-4.162l13.661,14.208c0.571,0.593,1.339,0.92,2.162,0.92  c0.779,0,1.518-0.297,2.079-0.837C56.255,54.982,56.293,53.08,55.146,51.887z M23.984,6c9.374,0,17,7.626,17,17s-7.626,17-17,17  s-17-7.626-17-17S14.61,6,23.984,6z"
                />
              </svg>

              <input
                class="relative w-95 mr-8 text-sm text-gray-800 focus:outline-none"
                type="search"
                name="search"
                placeholder="البحث عن المنتجات"
              />
            </div>
            <button
              class="py-2 px-2 mx-2 bg-[var(--main)] !text-white text-sm rounded shadow shadow-xl"
            >
              البحث
            </button>
          </div>

          <div class="flex gap-8">
            <div class="flex gap-1 items-end items-center justify-center group">
              <svg viewBox="0 0 24 24" fill="none" width="24">
                <g stroke="#313133" id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g
                  id="SVGRepo_tracerCarrier"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></g>
                <g id="SVGRepo_iconCarrier">
                  <path
                    d="M16 7C16 9.20914 14.2091 11 12 11C9.79086 11 8 9.20914 8 7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7Z"
                    stroke="#313133"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                  <path
                    d="M12 14C8.13401 14 5 17.134 5 21H19C19 17.134 15.866 14 12 14Z"
                    stroke="#313133"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                </g>
              </svg>
              <span class="text-nowrap"> تسجيل الدخول</span>
            </div>
            <div class="flex gap-1 items-end items-center justify-center group">
              <svg
           
                viewBox="0 0 24 24"
                fill="none"
                width="24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g
                  id="SVGRepo_tracerCarrier"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></g>
                <g id="SVGRepo_iconCarrier">
                  <path
                    d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"
                    stroke="#313133"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                  <path
                    d="M9 9C9 5.49997 14.5 5.5 14.5 9C14.5 11.5 12 10.9999 12 13.9999"
                    stroke="#313133"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                  <path
                    d="M12 18.01L12.01 17.9989"
                    stroke="#313133"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                </g>
              </svg>
              <span class="text-nowrap"> المساعده</span>
            </div>
            <div class="flex gap-1 items-end items-center justify-center group">
              <svg viewBox="0 -0.5 25 25" fill="none" width="24">
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g
                  id="SVGRepo_tracerCarrier"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></g>
                <g id="SVGRepo_iconCarrier">
                  <path
                    fill-rule="evenodd"
                    clip-rule="evenodd"

                    stroke="#313133"

                    stroke-linejoin="round"
                  ></path>
                  <path
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M15.767 19.063C15.7648 19.5777 15.3461 19.9934 14.8313 19.992C14.3166 19.9905 13.9003 19.5724 13.901 19.0576C13.9017 18.5429 14.3192 18.126 14.834 18.126C15.082 18.1265 15.3196 18.2255 15.4946 18.4012C15.6695 18.577 15.7675 18.815 15.767 19.063V19.063Z"

                  ></path>
                  <path
                    d="M8.03326 7.74034C8.13561 8.14171 8.54395 8.38411 8.94532 8.28176C9.34669 8.17941 9.58909 7.77106 9.48674 7.36969L8.03326 7.74034ZM8.136 5.10801L8.86281 4.92267L8.86017 4.91288L8.136 5.10801ZM7.993 5.00001V5.75009L8.00342 5.74994L7.993 5.00001ZM5.5 4.25001C5.08579 4.25001 4.75 4.5858 4.75 5.00001C4.75 5.41423 5.08579 5.75001 5.5 5.75001V4.25001ZM9.44322 14.6934C9.85707 14.6761 10.1786 14.3267 10.1614 13.9128C10.1441 13.4989 9.79464 13.1774 9.38078 13.1947L9.44322 14.6934ZM9.412 16.25L9.38078 16.9994C9.39118 16.9998 9.40159 17 9.412 17L9.412 16.25ZM16.054 17C16.4682 17 16.804 16.6642 16.804 16.25C16.804 15.8358 16.4682 15.5 16.054 15.5V17ZM9.48674 7.36969L8.86274 4.92269L7.40926 5.29334L8.03326 7.74034L9.48674 7.36969ZM8.86017 4.91288C8.75358 4.51729 8.39224 4.2444 7.98258 4.25009L8.00342 5.74994C7.72726 5.75378 7.48369 5.56982 7.41183 5.30315L8.86017 4.91288ZM7.993 4.25001H5.5V5.75001H7.993V4.25001ZM9.38078 13.1947C8.36094 13.2371 7.55603 14.0763 7.55603 15.097H9.05603C9.05603 14.8804 9.22682 14.7024 9.44322 14.6934L9.38078 13.1947ZM7.55603 15.097C7.55603 16.1177 8.36094 16.9569 9.38078 16.9994L9.44322 15.5007C9.22682 15.4916 9.05603 15.3136 9.05603 15.097H7.55603ZM9.412 17H16.054V15.5H9.412V17Z"
                    fill="#000000"
                  ></path>
                </g>
              </svg>
              <span class="text-nowrap">عربة التسوق</span>
            </div>
          </div>
        </div>
      </nav>
    </div>
  </body>
</html>
