<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up Form | Regex</title>
<link rel="stylesheet" href="style.css" />
  

</head>
<body>

  <!-- Username Validation -->
  <section>
    <h2>اسم المستخدم</h2>
    <label for="username">اسم المستخدم</label>
    <input id="username" placeholder="مثال: dai_mashal" />
    <div id="userRules">
      <div class="rule" data-rule="start">يبدأ بحرف</div>
      <div class="rule" data-rule="charset">حروف/أرقام/شرطة سفلية فقط</div>
      <div class="rule" data-rule="length">من 3 إلى 20 حرفًا</div>
    </div>
  </section>

  <!-- Email Validation -->
  <section>
    <h2>البريد الإلكتروني</h2>
    <label for="email">البريد الإلكتروني</label>
    <input id="email" placeholder="name@example.com" />
    <div class="rule">صيغة بريد صحيحة مطلوبة</div>
  </section>

  <!-- Password Validation -->
  <section>
    <h2>كلمة المرور</h2>
    <label for="password">كلمة المرور</label>
    <input id="password" type="password" />
    <div id="passRules">
      <div class="rule" data-rule="len">8+ أحرف</div>
      <div class="rule" data-rule="lower">حرف صغير</div>
      <div class="rule" data-rule="upper">حرف كبير</div>
      <div class="rule" data-rule="digit">رقم</div>
      <div class="rule" data-rule="special">رمز خاص</div>
      <div class="rule" data-rule="space">بدون مسافات</div>
    </div>
  </section>

  <!-- Confirm Password -->
  <section>
    <h2>تأكيد كلمة المرور</h2>
    <label for="confirm">تأكيد كلمة المرور</label>
    <input id="confirm" type="password" />
    <div id="confirmHint" class="rule">يجب أن تتطابق مع كلمة المرور</div>
  </section>

  <!-- Submit Button -->
  <section>
    <button id="submitBtn" disabled>إنشاء الحساب</button>
    <div id="formMsg" class="rule" style="margin-top:8px"></div>
  </section>
  <script src="app.js" defer></script>



</body>
</html>
