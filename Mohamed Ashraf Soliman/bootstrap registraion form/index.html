<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <title>Pen Master | Register</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark justify-content-between p-2">
        <div class="d-flex">
            <a class="navbar-brand text-capitalize" href="#">Pen Master</a>
        </div>
        <div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item text-capitalize"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item text-capitalize"><a class="nav-link" href="#">Log In</a></li>
                    <li class="nav-item text-capitalize"><a class="nav-link" href="#">register</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container pt-5">
        <form class="border rounded-3 p-5" method="POST" action="#" enctype="multipart/form-data">
            <h2 class="text-capitalize">register</h2>
            <div class="form-group pb-3">
                <label class="text-capitalize" for="username">username:</label>
                <input type="text" class="form-control" name="username">
                <p class="form-text text-danger warning">enter your username please</p>
                <p class="form-text text-danger warning">username can only include characters, numbers, spaces and dash and underscore <p>
            </div>
            <div class="form-group pb-3">
                <label class="text-capitalize" for="email">email:</label>
                <input type="email" class="form-control" name="email" id="email">
                <p class="form-text text-danger warning">enter a valid email please</p>
            </div>
            <div class="form-group pb-3">
                <label class="text-capitalize" for="password">password</label>
                <input type="password" class="form-control" name="password" id="password">
                <p class="form-text text-danger warning">enter a password please</p>
            </div>
            <div class="form-group pb-3">
                <label class="text-capitalize" for="avatar">upload avatar</label>
                <input type="file" class="form-control" name="avatar" id="avatar">
            </div>
            <div class="form-group pb-3">
                <label class="text-capitalize" for="bio">bio:</label>
                <textarea class="form-control" name="bio"></textarea>
            </div>
            <input type="submit" class="btn btn-primary" value="register">
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
