<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://bootswatch.com/5/yeti/bootstrap.min.css">
    <title>ToDo List</title>
</head>
<body>
    <header class="mt-5 d-flex justify-content-center">
        <h1><span class="fas fa-note-sticky text-primary"></span>My<span class="text-primary">ToDo</span>List</h1>
    </header>
    <main class="container mt-5">
        <input type="text" placeholder="search tasks..." name="search" id="search" class="form-control">
        <form action="#" id="add-task">
            <h2 class="text-capitalize">add task</h2>
            <div class="form-group">
                <label for="task-name" class="form-label text-capitalize">task name</label>
                <input type="text" name="task-name" id="task-name" class="form-control">
            </div>
            <div class="form-group">
                <label for="task-description" class="form-label text-capitalize">description / details</label>
                <textarea name="task-description" id="task-description" class="form-control"></textarea>
            </div>
            <div class="form-group">
                <label for="due-date" class="form-label text-capitalize">due date</label>
                <input type="date" name="due-date" id="due-date" class="form-control">
            </div>
            <input type="submit" value="add" class="btn btn-primary text-capitalize w-100 mt-2" id="add">
        </form>
        <table class="table table-striped table-hover mt-5">
            <thead>
                <tr>
                    <td>task</td>
                    <td>description</td>
                    <td>due date</td>
                    <td></td>
                </tr>
            </thead>
            <tbody id="task-list">
            </tbody>
        </table>
    </main>
    <script src="assets/js/main.js"></script>
</body>
</html>
