<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Jumia</title>
</head>
<body lang="en" dir="ltr">
  <header class="container">
    <div>
      <div class="top-bar mb-2">
        <a href="#" class="sell">⭐ Sell on Jumia</a>
        <div class="lang-switch">
          <select id="language-select">
            <option value="en">🇬🇧 English</option>
            <option value="ar">🇪🇬 عربي</option>
          </select>
        </div>
      </div>
      <nav>
        <div class="row align-items-center justify-content-between">
          <div class="col-1">
            <a href="#">
              <div class="logo">
                <img src="assets/img/logo.png" alt="logo">
              </div>
            </a>
          </div>
          <div class="col-5 ms-5">
            <form action="#" method="get" class="search">
              <div class="find d-flex flex-row">
                <div class="pb-1 mx-2">
                  <label for="search-input">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0,0,256,256">
                    <g fill="#75757a" fill-rule="nonzero" stroke="none">
                      <g transform="scale(10.66667,10.66667)">
                        <path d="M13.26172,14.86719l2.48047,2.48047c-0.37891,0.72266 -0.41797,1.44141 -0.01953,1.83984l4.52734,4.52734c0.57031,0.57031 1.8125,0.25781 2.76563,-0.69922c0.95703,-0.95703 1.26953,-2.19531 0.69922,-2.76562l-4.52344,-4.52734c-0.40234,-0.39844 -1.12109,-0.35937 -1.84375,0.01563l-2.48047,-2.47656zM8.5,0c-4.69531,0 -8.5,3.80469 -8.5,8.5c0,4.69531 3.80469,8.5 8.5,8.5c4.69531,0 8.5,-3.80469 8.5,-8.5c0,-4.69531 -3.80469,-8.5 -8.5,-8.5zM8.5,15c-3.58984,0 -6.5,-2.91016 -6.5,-6.5c0,-3.58984 2.91016,-6.5 6.5,-6.5c3.58984,0 6.5,2.91016 6.5,6.5c0,3.58984 -2.91016,6.5 -6.5,6.5z"></path>
                      </g>
                    </g>
                  </svg>
                  </label>
                </div>
                <input type="text" id="search-input" placeholder="Search products, brands and categories">
              </div>
              <button>Search</button>
            </form>
          </div>
          <div class="btns col-4 d-flex justify-content-end">
            <div class="nav-items">
              <div class="account">👤 <span id="account-text" data-i18n="account">Account</span> ▼</div>
              <div class="help">❓ <span id="help-text" data-i18n="help">Help</span> ▼</div>
              <div class="cart">🛒 <span id="cart-text" data-i18n="cart">Cart</span></div>
            </div>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
