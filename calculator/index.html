<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="" />
  <meta http-equiv="X-UA-Compatible" content="IE=7" />
  <meta name="keywords" content="" />
  <title>Calculator</title>
  <!-- ~ Bootstrap CSS CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- ~ main style sheet -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="calculator">
    <div id="display" class="display">0</div>
    
    <div class="row g-2">
      <div class="col-3">
        <button class="btn btn-secondary w-100" id="clear">C</button>
      </div>
      <div class="col-3">
        <button class="btn btn-secondary w-100" id="backspace">←</button>
      </div>
      <div class="col-3">
        <button class="btn btn-secondary w-100" data-value="%">%</button>
      </div>
      <div class="col-3">
        <button class="btn btn-warning w-100" data-value="/">÷</button>
      </div>

      <div class="col-3">
        <button class="btn btn-light w-100" data-value="7">7</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light w-100" data-value="8">8</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light w-100" data-value="9">9</button>
      </div>
      <div class="col-3">
        <button class="btn btn-warning w-100" data-value="*">×</button>
      </div>

      <div class="col-3">
        <button class="btn btn-light w-100" data-value="4">4</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light w-100" data-value="5">5</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light w-100" data-value="6">6</button>
      </div>
      <div class="col-3">
        <button class="btn btn-warning w-100" data-value="-">−</button>
      </div>

      <div class="col-3">
        <button class="btn btn-light w-100" data-value="1">1</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light w-100" data-value="2">2</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light w-100" data-value="3">3</button>
      </div>
      <div class="col-3">
        <button class="btn btn-warning w-100" data-value="+">+</button>
      </div>

      <div class="col-6">
        <button class="btn btn-light w-100" data-value="0">0</button>
      </div>
      <div class="col-3">
        <button class="btn btn-light w-100" data-value=".">.</button>
      </div>
      <div class="col-3">
        <button class="btn btn-success w-100" id="equals">=</button>
      </div>
    </div>
  </div>

  <!-- ! main js file -->
  <script src="./main.js"></script>
</body>
</html>
