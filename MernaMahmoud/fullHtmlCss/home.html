<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <style>
    body {
      margin: 2px;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }

    header {
      background-color: #251264;
      padding: 10px 20px;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }

    .search-box input {
      padding: 5px;
      border: none;
      border-radius: 4px;
    }

    /* Title section */
    .hero {
      text-align: center;
      margin: 40px 0;
      background: linear-gradient(to right, #f7f7f7, #e6e6fa);
      padding: 40px 20px;
      border-radius: 10px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .hero h1 {
      color: #251264;
      font-size: 36px;
      font-weight: bold;
      margin: 0;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .card h3 {
      margin: 10px 0;
      padding: 0 10px;
      color: #251264;
    }
  </style>
</head>
<body>
  <header>
    <div class="navbar">
      <div class="logo">
        <img src="assets/images/logo.webp" width="30" height="30" alt="">
      </div>

      <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="contactus.html">Contact Us</a>
      </div>

      <div class="search-box">
        <input type="text" placeholder="Search...">
      </div>
    </div>
  </header>

  <section class="hero">
    <h1>Best Place to Learn Graphic Design</h1>
  </section>

  <section class="grid">
    <div class="card">
      <img src="assets/images/graphic1.webp" alt="Video 1">
      <h3>Intro to Photoshop</h3>
    </div>
    <div class="card">
      <img src="assets/images/graphic2.webp" alt="Video 2">
      <h3>Illustrator Basics</h3>
    </div>
    <div class="card">
      <img src="assets/images/graphic3.webp" alt="Video 3">
      <h3>Color Theory in Design</h3>
    </div>
    <div class="card">
      <img src="assets/images/graphic4.webp" alt="Video 4">
      <h3>Logo Design Principles</h3>
    </div>
    <div class="card">
      <img src="assets/images/graphic5.webp" alt="Video 5">
      <h3>Typography Tips</h3>
    </div>
    <div class="card">
      <img src="assets/images/graphic6.webp" alt="Video 6">
      <h3>UI/UX Essentials</h3>
    </div>
  </section>
</body>
</html>
