<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            margin: 2px;
            font-family: Arial;
            background-color: #f0f0f0;
        }

        header {
            background-color: #251264;
            padding: 10px 20px;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .search-box input {
            padding: 5px;
            border: none;
            border-radius: 4px;
        }

        .register-box {
            width: 300px;
            margin: 50px auto; 
            padding: 20px;
            border: 1px solid #ccc;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .register-box h2 {
            margin-bottom: 15px;
        }

        .register-box input[type="text"],
        .register-box input[type="email"],
        .register-box input[type="password"] {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 4px;
        }

        .register-box input[type="submit"] {
            width: 100%;
            padding: 8px;
            background-color: #251264;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .register-box input[type="submit"]:hover {
            background-color: #3d2f91;
        }

        /* لينك الرجوع للـ Login */
        .login-link {
            margin-top: 15px;
            display: block;
            color: #251264;
            text-decoration: underline;
            cursor: pointer;
        }

        .login-link:hover {
            color: #3d2f91;
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <div class="logo">
                <img src="assets/images/logo.webp" width="30" height="30" alt="">
            </div>

            <div class="nav-links">
                <a href="home.html">Home</a>
                <a href="contactus.html">Contact Us</a>
            </div>

            <div class="search-box">
                <input type="text" placeholder="Search...">
            </div>
        </div>
    </header>

    <!-- Register Form -->
    <div class="register-box">
        <h2>Register</h2>
        <form>
            <input type="text" id="username" placeholder="Username">
            <span id="usernameSpn"></span>

            <input type="email" id="email" placeholder="Email">
            <span id="emailSpn"></span>

            <input type="password" id="pwd" placeholder="Password">
            <span id="pwdSpn"></span>

            <input type="password" id="confirmPwd" placeholder="Confirm Password">
            <span id="confirmPwdSpn"></span>

            <input type="submit" value="Register">
        </form>

        <!-- Link back to Login -->
        <a href="login.html" class="login-link">Already have an account? Login</a>
    </div>

    <script src="registerValidation.js"></script>
</body>
</html>
